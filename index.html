<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Roria Conquest Shiny Counter</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes glow {
      0% { filter: drop-shadow(0 0 10px gold); }
      50% { filter: drop-shadow(0 0 25px hotpink); }
      100% { filter: drop-shadow(0 0 10px cyan); }
    }

    @keyframes sparkle {
      0% {
        transform: scale(0.5) rotate(0deg);
        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform: scale(1.4) rotate(180deg);
        opacity: 0;
      }
    }

    .float {
      animation: float 2s ease-in-out infinite;
    }

    .glow {
      animation: glow 2s infinite;
    }

    .sparkle {
      position: absolute;
      font-size: 24px;
      animation: sparkle 2s infinite;
      pointer-events: none;
    }

    .sparkle:nth-child(1) {
      top: 10%;
      left: 20%;
      animation-delay: 0s;
    }

    .sparkle:nth-child(2) {
      top: 25%;
      right: 15%;
      animation-delay: 0.5s;
    }

    .sparkle:nth-child(3) {
      bottom: 20%;
      left: 25%;
      animation-delay: 1s;
    }

    .sparkle:nth-child(4) {
      bottom: 15%;
      right: 20%;
      animation-delay: 1.5s;
    }
  </style>
</head>

<body class="bg-black">

<div id="root"></div>

<script type="text/babel">

function ShinyCounter() {

  const [encounters, setEncounters] = React.useState(() => {
    return Number(localStorage.getItem('rc-encounters')) || 0
  })

  const [pokemonName, setPokemonName] = React.useState(() => {
    return localStorage.getItem('rc-pokemon') || 'Tapu Lele'
  })

  const [phase, setPhase] = React.useState(() => {
    return Number(localStorage.getItem('rc-phase')) || 1
  })

  const [showShinySprite, setShowShinySprite] =
    React.useState(true)

  const [weekendBoost, setWeekendBoost] =
    React.useState(true)

  const [shinyCharm, setShinyCharm] =
    React.useState(true)

  const [shinyROPower, setShinyROPower] =
    React.useState(false)

  const [legendaryROPower, setLegendaryROPower] =
    React.useState(false)

  const [isRoaming, setIsRoaming] =
    React.useState(false)

  React.useEffect(() => {
    localStorage.setItem(
      'rc-encounters',
      encounters
    )
  }, [encounters])

  React.useEffect(() => {
    localStorage.setItem(
      'rc-pokemon',
      pokemonName
    )
  }, [pokemonName])

  React.useEffect(() => {
    localStorage.setItem(
      'rc-phase',
      phase
    )
  }, [phase])

  function getOdds() {

    // STATIC
    if (!isRoaming) {

      if (
        shinyCharm &&
        shinyROPower &&
        weekendBoost
      ) return 43

      if (
        shinyCharm &&
        shinyROPower
      ) return 64

      if (
        shinyROPower &&
        weekendBoost
      ) return 85

      if (shinyROPower)
        return 128

      if (
        shinyCharm &&
        weekendBoost
      ) return 683

      if (shinyCharm)
        return 1024

      if (weekendBoost)
        return 1365

      return 2048
    }

    // ROAMING + LEGENDARY RO POWER
    if (legendaryROPower) {

      if (
        shinyCharm &&
        shinyROPower &&
        weekendBoost
      ) return 10667

      if (
        shinyCharm &&
        shinyROPower
      ) return 16000

      if (
        shinyROPower &&
        weekendBoost
      ) return 21333

      if (shinyROPower)
        return 32000

      if (
        shinyCharm &&
        weekendBoost
      ) return 170667

      if (shinyCharm)
        return 256000

      if (weekendBoost)
        return 341333

      return 512000
    }

    // ROAMING
    if (
      shinyCharm &&
      shinyROPower &&
      weekendBoost
    ) return 42667

    if (
      shinyCharm &&
      shinyROPower
    ) return 64000

    if (
      shinyROPower &&
      weekendBoost
    ) return 85333

    if (shinyROPower)
      return 128000

    if (
      shinyCharm &&
      weekendBoost
    ) return 682667

    if (shinyCharm)
      return 1024000

    if (weekendBoost)
      return 1365333

    return 2048000
  }

  const odds = getOdds()

  const probability =
    1 - Math.pow(
      (odds - 1) / odds,
      encounters
    )

  const percent =
    Math.min(probability * 100, 99.99).toFixed(2)

  const progress =
    Math.min(
      (encounters / odds) * 100,
      100
    )

  const formattedName =
    pokemonName
      .toLowerCase()
      .replace(/ /g, '')
      .replace('.', '')
      .replace("'", '')

  const spriteUrl = showShinySprite
    ? `https://play.pokemonshowdown.com/sprites/ani-shiny/${formattedName}.gif`
    : `https://play.pokemonshowdown.com/sprites/ani/${formattedName}.gif`

  function incrementEncounter() {
    setEncounters((e) => e + 1)
  }

  function shinySimulator() {

    const roll =
      Math.floor(
        Math.random() * odds
      ) + 1

    if (roll === 1) {

      alert('✨ SHINY FOUND ✨')

    } else {

      alert('No shiny this encounter.')
    }
  }

  return (

    <div className="min-h-screen bg-black text-white flex items-center justify-center p-6">

      <div className="w-full max-w-5xl bg-zinc-900 border border-zinc-700 rounded-3xl shadow-2xl p-8 relative overflow-hidden">

        <div className="text-center mb-8">

          <h1 className="text-5xl font-black animate-pulse">
            ✨ Roria Conquest Shiny Counter ✨
          </h1>

          <p className="text-zinc-400 mt-2">
            Animated Shiny Hunting Tracker
          </p>

          <p className="text-yellow-400 font-bold mt-2 text-sm tracking-wide">
  ⚠️ This tool is only for legendary shiny hunting
</p>
        </div>

        <div className="relative flex justify-center items-center mb-8">

          {showShinySprite && (
            <>
              <div className="sparkle">✨</div>
              <div className="sparkle">⭐</div>
              <div className="sparkle">💫</div>
              <div className="sparkle">✨</div>
            </>
          )}

          <img
            src={spriteUrl}
            className="
              w-56
              h-56
              object-contain
              float
              glow
              relative
              z-10
            "
            onError={(e) => {
              e.target.src =
                'https://play.pokemonshowdown.com/sprites/ani/pikachu.gif'
            }}
          />

        </div>

        <input
          value={pokemonName}
          onChange={(e) =>
            setPokemonName(
              e.target.value
            )
          }
          placeholder="Pokémon Name"
          className="
            w-full
            bg-zinc-800
            border
            border-zinc-700
            rounded-2xl
            px-4
            py-4
            text-center
            text-xl
            outline-none
            focus:border-pink-500
            mb-6
          "
        />

        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">

          <button
            onClick={() =>
              setWeekendBoost(!weekendBoost)
            }
            className="bg-pink-600 rounded-2xl p-4 font-bold"
          >
            Weekend
            <br/>
            {weekendBoost ? 'ON' : 'OFF'}
          </button>

          <button
            onClick={() =>
              setShinyCharm(!shinyCharm)
            }
            className="bg-pink-600 rounded-2xl p-4 font-bold"
          >
            Charm
            <br/>
            {shinyCharm ? 'ON' : 'OFF'}
          </button>

          <button
            onClick={() =>
              setShinyROPower(!shinyROPower)
            }
            className="bg-pink-600 rounded-2xl p-4 font-bold"
          >
            Shiny RO
            <br/>
            {shinyROPower ? 'ON' : 'OFF'}
          </button>

          <button
            onClick={() =>
              setLegendaryROPower(!legendaryROPower)
            }
            className="bg-pink-600 rounded-2xl p-4 font-bold"
          >
            Legend RO
            <br/>
            {legendaryROPower ? 'ON' : 'OFF'}
          </button>

        </div>

        <button
          onClick={() =>
            setIsRoaming(!isRoaming)
          }
          className="
            w-full
            bg-blue-600
            rounded-2xl
            py-4
            text-xl
            font-bold
            mb-6
          "
        >
          {isRoaming
            ? 'Roaming Legendary Mode'
            : 'Static Encounter Mode'}
        </button>

        <button
          onClick={() =>
            setShowShinySprite(
              !showShinySprite
            )
          }
          className="
            w-full
            bg-yellow-500
            hover:bg-yellow-400
            transition
            rounded-2xl
            py-4
            text-xl
            font-bold
            text-black
            mb-6
          "
        >
          Toggle Shiny Sprite
        </button>

        <div className="w-full bg-zinc-700 rounded-full h-5 overflow-hidden mb-8">

          <div
            className="bg-pink-500 h-full transition-all duration-300"
            style={{
              width: `${progress}%`
            }}
          />

        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">

          <div className="bg-zinc-800 rounded-2xl p-6 text-center">

            <p className="text-zinc-400">
              Current Odds
            </p>

            <h2 className="text-4xl font-black mt-2">
              1 / {odds.toLocaleString()}
            </h2>

          </div>

          <div className="bg-zinc-800 rounded-2xl p-6 text-center">

            <p className="text-zinc-400">
              Encounters
            </p>

            <h2 className="text-5xl font-black mt-2">
              {encounters}
            </h2>

          </div>

          <div className="bg-zinc-800 rounded-2xl p-6 text-center">

            <p className="text-zinc-400">
              Chance By Now
            </p>

           <h2 className="text-4xl font-black mt-2">
  {percent}%
  {Number(percent) >= 99.99 && <p className="text-sm text-zinc-400 font-normal mt-1">just reset bro 💀 please let her rest</p>}
</h2>

          </div>

          <div className="bg-zinc-800 rounded-2xl p-6 text-center">

            <p className="text-zinc-400">
              Current Phase
            </p>

            <h2 className="text-4xl font-black mt-2">
              #{phase}
            </h2>

          </div>

        </div>

        <div className="flex gap-3 mb-4">

          <button
            onClick={incrementEncounter}
            className="
              flex-1
              bg-pink-600
              hover:bg-pink-500
              transition
              rounded-2xl
              py-5
              text-2xl
              font-black
            "
          >
            +1 Encounter
          </button>

          <button
            onClick={() =>
              setEncounters(
                Math.max(0, encounters - 1)
              )
            }
            className="
              flex-1
              bg-zinc-700
              hover:bg-zinc-600
              transition
              rounded-2xl
              py-5
              text-2xl
              font-black
            "
          >
            -1
          </button>

        </div>

        <div className="flex gap-3 mb-6">

          <button
            onClick={() =>
              setPhase(phase + 1)
            }
            className="
              flex-1
              bg-yellow-500
              hover:bg-yellow-400
              transition
              rounded-2xl
              py-4
              font-bold
              text-black
            "
          >
            Next Phase
          </button>

          <button
            onClick={() =>
              setEncounters(0)
            }
            className="
              flex-1
              bg-red-600
              hover:bg-red-500
              transition
              rounded-2xl
              py-4
              font-bold
            "
          >
            Reset
          </button>

        </div>

        <button
          onClick={shinySimulator}
          className="
            w-full
            bg-green-500
            hover:bg-green-400
            transition
            rounded-2xl
            py-5
            text-2xl
            font-black
            text-black
          "
        >
          🎰 Shiny Simulator
        </button>

        <div className="mt-8 text-center text-zinc-500 text-sm">

          Created by Ren
          <br/>

          Discord:
          @they_call_me_ren

          <br/>

          Instagram:
          @they_call_metarun

        </div>

      </div>

    </div>
  )
}

ReactDOM.createRoot(
  document.getElementById('root')
).render(<ShinyCounter />)

</script>

</body>
</html>
