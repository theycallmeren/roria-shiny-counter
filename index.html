<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roria Shiny Counter</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>

<body class="bg-black">

<div id="root"></div>

<script type="text/babel">

function App() {

  const [encounters, setEncounters] = React.useState(() => {
    return Number(localStorage.getItem("rc-encounters")) || 0
  })

  const [pokemonName, setPokemonName] = React.useState(() => {
    return localStorage.getItem("rc-pokemon") || "Tapu Lele"
  })

  const [phase, setPhase] = React.useState(() => {
    return Number(localStorage.getItem("rc-phase")) || 1
  })

  const [theme, setTheme] = React.useState("dark")

  const [showShinySprite, setShowShinySprite] =
    React.useState(false)

  const [hunts, setHunts] = React.useState(() => {
    return JSON.parse(localStorage.getItem("rc-hunts")) || []
  })

  const [weekendBoost, setWeekendBoost] = React.useState(true)
  const [shinyCharm, setShinyCharm] = React.useState(true)
  const [shinyROPower, setShinyROPower] = React.useState(false)
  const [legendaryROPower, setLegendaryROPower] = React.useState(false)
  const [isRoaming, setIsRoaming] = React.useState(false)

  React.useEffect(() => {
    localStorage.setItem("rc-encounters", encounters)
  }, [encounters])

  React.useEffect(() => {
    localStorage.setItem("rc-pokemon", pokemonName)
  }, [pokemonName])

  React.useEffect(() => {
    localStorage.setItem("rc-phase", phase)
  }, [phase])

  function getOdds() {

    if (!isRoaming) {
      if (shinyCharm && shinyROPower && weekendBoost) return 43
      if (shinyCharm && shinyROPower) return 64
      if (shinyROPower && weekendBoost) return 85
      if (shinyROPower) return 128
      if (shinyCharm && weekendBoost) return 683
      if (shinyCharm) return 1024
      if (weekendBoost) return 1365
      return 2048
    }

    if (legendaryROPower) {
      if (shinyCharm && shinyROPower && weekendBoost) return 10667
      if (shinyCharm && shinyROPower) return 16000
      if (shinyROPower && weekendBoost) return 21333
      if (shinyROPower) return 32000
      if (shinyCharm && weekendBoost) return 170667
      if (shinyCharm) return 256000
      if (weekendBoost) return 341333
      return 512000
    }

    if (shinyCharm && shinyROPower && weekendBoost) return 42667
    if (shinyCharm && shinyROPower) return 64000
    if (shinyROPower && weekendBoost) return 85333
    if (shinyROPower) return 128000
    if (shinyCharm && weekendBoost) return 682667
    if (shinyCharm) return 1024000
    if (weekendBoost) return 1365333

    return 2048000
  }

  const odds = getOdds()

  const probability =
    1 - Math.pow((odds - 1) / odds, encounters)

  const percent = (probability * 100).toFixed(2)

  const progress =
    Math.min((encounters / odds) * 100, 100)

  const spriteType =
    showShinySprite ? "shiny" : "normal"

  function saveCurrentHunt() {

    const newHunt = {
      pokemon: pokemonName,
      encounters,
      phase,
      odds,
      date: new Date().toLocaleString()
    }

    const updated = [...hunts, newHunt]

    setHunts(updated)

    localStorage.setItem(
      "rc-hunts",
      JSON.stringify(updated)
    )
  }

  function shinySimulator() {

    const roll =
      Math.floor(Math.random() * odds) + 1

    if (roll === 1) {

      alert("✨ SHINY FOUND! ✨")

    } else {

      alert("No shiny this encounter...")

    }
  }

  return (

    <div className={
      theme === "dark"
      ? "min-h-screen bg-black text-white flex items-center justify-center p-6"
      : "min-h-screen bg-white text-black flex items-center justify-center p-6"
    }>

      <div className="w-full max-w-4xl bg-zinc-900 rounded-3xl shadow-2xl p-8 border border-zinc-700">

        <div className="text-center mb-8">

          <h1 className="text-4xl font-bold animate-pulse">
            ✨ Roria Conquest Shiny Counter ✨
          </h1>

          <p className="text-zinc-400 mt-2">
            Dynamic shiny odds calculator
          </p>

          <img
            src={`https://img.pokemondb.net/sprites/home/${spriteType}/${pokemonName.toLowerCase().replace(/ /g, "-")}.png`}
            className="w-40 h-40 mx-auto mt-4 drop-shadow-2xl transition-all duration-300 hover:scale-110"
            onError={(e) => {
              e.target.style.display = "none"
            }}
          />

          <button
            onClick={() =>
              setShowShinySprite(!showShinySprite)
            }
            className="mt-4 bg-yellow-500 hover:bg-yellow-400 transition rounded-2xl px-6 py-3 font-bold text-black"
          >
            {showShinySprite
              ? "Show Normal Sprite"
              : "Show Shiny Sprite"}
          </button>

          <input
            value={pokemonName}
            onChange={(e) => setPokemonName(e.target.value)}
            placeholder="Pokémon Name"
            className="w-full mt-6 bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-center text-lg outline-none focus:border-pink-500"
          />

        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-8">

          <button
            onClick={() => setWeekendBoost(!weekendBoost)}
            className="bg-pink-600 rounded-2xl p-4 font-bold"
          >
            Weekend Boost: {weekendBoost ? "ON" : "OFF"}
          </button>

          <button
            onClick={() => setShinyCharm(!shinyCharm)}
            className="bg-pink-600 rounded-2xl p-4 font-bold"
          >
            Shiny Charm: {shinyCharm ? "ON" : "OFF"}
          </button>

          <button
            onClick={() => setShinyROPower(!shinyROPower)}
            className="bg-pink-600 rounded-2xl p-4 font-bold"
          >
            Shiny RO-Power: {shinyROPower ? "ON" : "OFF"}
          </button>

          <button
            onClick={() => setLegendaryROPower(!legendaryROPower)}
            className="bg-pink-600 rounded-2xl p-4 font-bold"
          >
            Legendary RO-Power: {legendaryROPower ? "ON" : "OFF"}
          </button>

        </div>

        <button
          onClick={() => setIsRoaming(!isRoaming)}
          className="w-full bg-blue-600 rounded-2xl py-4 text-xl font-bold mb-4"
        >
          {isRoaming ? "Roaming Legendary Mode" : "Static Encounter Mode"}
        </button>

        <button
          onClick={() =>
            setTheme(theme === "dark" ? "light" : "dark")
          }
          className="w-full bg-purple-600 rounded-2xl py-4 text-xl font-bold mb-8"
        >
          Toggle Theme
        </button>

        <div className="w-full bg-zinc-700 rounded-full h-5 mb-8 overflow-hidden">

          <div
            className="bg-pink-500 h-full transition-all"
            style={{ width: `${progress}%` }}
          />

        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

          <div className="bg-zinc-800 rounded-2xl p-5 text-center">
            <p className="text-zinc-400 text-sm">
              Current Odds
            </p>

            <h2 className="text-3xl font-bold mt-2">
              1 / {odds.toLocaleString()}
            </h2>
          </div>

          <div className="bg-zinc-800 rounded-2xl p-5 text-center">
            <p className="text-zinc-400 text-sm">
              Current Hunt
            </p>

            <h2 className="text-3xl font-bold mt-2">
              ✨ {pokemonName} ✨
            </h2>
          </div>

          <div className="bg-zinc-800 rounded-2xl p-5 text-center">
            <p className="text-zinc-400 text-sm">
              Encounters
            </p>

            <h2 className="text-5xl font-bold mt-2">
              {encounters}
            </h2>
          </div>

          <div className="bg-zinc-800 rounded-2xl p-5 text-center">
            <p className="text-zinc-400 text-sm">
              Chance By Now
            </p>

            <h2 className="text-4xl font-bold mt-2">
              {percent}%
            </h2>
          </div>

        </div>

        <div className="flex gap-3 mt-8">

          <button
            onClick={() => setEncounters(encounters + 1)}
            className="flex-1 bg-pink-600 rounded-2xl py-4 text-xl font-bold"
          >
            +1 Encounter
          </button>

          <button
            onClick={() =>
              setEncounters(Math.max(0, encounters - 1))
            }
            className="flex-1 bg-zinc-700 rounded-2xl py-4 text-xl font-bold"
          >
            -1
          </button>

        </div>

        <div className="flex gap-3 mt-4">

          <button
            onClick={() => setPhase(phase + 1)}
            className="flex-1 bg-yellow-600 rounded-2xl py-4 text-lg font-bold"
          >
            Next Phase ({phase})
          </button>

          <button
            onClick={() => setEncounters(0)}
            className="flex-1 bg-red-700 rounded-2xl py-4 text-lg font-bold"
          >
            Reset Counter
          </button>

        </div>

        <button
          onClick={saveCurrentHunt}
          className="w-full mt-4 bg-green-600 rounded-2xl py-4 text-lg font-bold"
        >
          Save Hunt
        </button>

        <button
          onClick={shinySimulator}
          className="w-full mt-4 bg-yellow-500 hover:bg-yellow-400 transition rounded-2xl py-4 text-lg font-bold text-black"
        >
          🎰 Shiny Simulator
        </button>

        <div className="mt-8">

          <h2 className="text-2xl font-bold mb-4">
            Saved Hunts
          </h2>

          <div className="space-y-3">

            {hunts.map((hunt, index) => (

              <div
                key={index}
                className="bg-zinc-800 rounded-2xl p-4"
              >

                <div className="font-bold text-lg">
                  ✨ {hunt.pokemon}
                </div>

                <div className="mt-1">
                  Encounters: {hunt.encounters}
                </div>

                <div>
                  Odds: 1 / {hunt.odds.toLocaleString()}
                </div>

                <div>
                  Phase: {hunt.phase}
                </div>

                <div className="text-sm text-zinc-400 mt-2">
                  {hunt.date}
                </div>

              </div>

            ))}

          </div>

        </div>

        <div className="mt-8 text-sm text-zinc-500 text-center">
          Probability uses cumulative odds and is not guaranteed.
        </div>

        <div className="mt-4 text-center text-zinc-600 text-sm">
          Created by Ren • Discord: @they_call_me_ren • Instagram: @they_call_metarun
        </div>

      </div>

    </div>
  )
}

ReactDOM.createRoot(
  document.getElementById("root")
).render(<App />)

</script>

</body>
</html>
